<script src="/icons.js"></script>
<style>
    /* Abstände und Schrift setzt die Visualisierung am body, deshalb body-Margins nicht überschreiben.
       Als Flex-Element füllt body den Rest abzüglich dieser Margins. */
    html {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    body {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        color: var(--content-color, CanvasText);
    }

    * {
        box-sizing: border-box;
    }

    .grid {
        display: grid;
        /* Spalten, Maße und Beschriftungshöhe setzt layoutGrid(). Die Schaltflächen füllen die Höhe zwischen den
           Rändern der Visualisierung (body-Margins); nur ein Rest über ihre Höchsthöhe hinaus wird oben und unten
           gleichmäßig verteilt, nie zwischen den Zeilen. */
        grid-template-columns: repeat(var(--columns, 1), var(--size, 64px));
        grid-auto-rows: auto;
        justify-content: center;
        align-content: center;
        gap: var(--gap, 8px);
        width: 100%;
        height: 100%;
        transition: opacity 0.15s ease;
    }

    /* Schaltfläche = Quadrat mit Grafik, darunter die Beschriftung */
    .switch {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--label-gap, 4px);
        width: var(--size, 64px);
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .switch:focus-visible {
        outline: none;
    }

    .switch:focus-visible .face {
        outline: 2px solid var(--accent-color, currentColor);
        outline-offset: -2px;
    }

    .switch:disabled {
        cursor: default;
        opacity: 0.4;
    }

    .face {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: var(--size, 64px);
        height: var(--face-height, var(--size, 64px));
        overflow: hidden;
        padding: calc(var(--size, 64px) * 0.1);
        border-radius: calc(var(--size, 64px) * 0.16);
        background: color-mix(in srgb, var(--content-color, CanvasText) 6%, transparent);
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .switch:hover .face {
        background: color-mix(in srgb, var(--content-color, CanvasText) 10%, transparent);
    }

    /* Aktive Aktoren: Schaltfläche etwas heller hinterlegt */
    .switch[data-on="true"] .face {
        background: color-mix(in srgb, var(--content-color, CanvasText) 14%, transparent);
    }

    .switch[data-on="true"]:hover .face {
        background: color-mix(in srgb, var(--content-color, CanvasText) 18%, transparent);
    }

    .switch:active .face,
    .switch[data-pressed="true"] .face {
        transform: scale(0.95);
    }

    .switch:disabled .face {
        transform: none;
    }

    /* Bereich für Icon bzw. Bild innerhalb des Quadrats */
    .graphic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
        /* icons.js ersetzt das <i> durch ein SVG mit 1em Höhe; die Schriftgröße skaliert damit das Icon. */
        font-size: calc(var(--size, 64px) * 0.58);
        transition: color 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
    }

    .graphic img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: calc(var(--size, 64px) * 0.06);
    }

    /* An: Icon in eigener Farbe bzw. Akzentfarbe, Bild im Original */
    .switch[data-on="true"] .graphic {
        color: var(--on-color, var(--accent-color, currentColor));
    }

    /* Aus: Icon grau; Bild ohne eigenes Aus-Bild in Graustufen */
    .switch[data-on="false"] .graphic {
        color: var(--disabled-color, currentColor);
        opacity: 0.45;
    }

    .switch[data-on="false"][data-has-off-image="true"] .graphic {
        opacity: 1;
    }

    .switch[data-on="false"][data-has-off-image="false"] .graphic img {
        filter: grayscale(1);
    }

    .label {
        flex: 0 0 auto;
        width: 100%;
        height: var(--label-height, 1.2em);
        overflow: hidden;
        font-size: var(--label-size, 12px);
        line-height: var(--label-height, 1.2em);
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .empty {
        display: grid;
        place-items: center;
        grid-column: 1 / -1;
        grid-row: 1 / -1;
        opacity: 0.6;
        text-align: center;
    }

    /* Bei geöffnetem Menü tritt das Raster zurück. */
    .grid[data-dimmed="true"] {
        opacity: 0.08;
        pointer-events: none;
    }

    /* Aktor mit Zusatzvariablen: Button und Pfeil in einer gemeinsamen Zelle */
    .cell {
        position: relative;
        width: var(--size, 64px);
        min-width: 0;
    }

    .more {
        position: absolute;
        top: calc(var(--face-height, var(--size, 64px)) - var(--more-size, 24px) - var(--size, 64px) * 0.05);
        right: calc(var(--size, 64px) * 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--more-size, 24px);
        height: var(--more-size, 24px);
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: color-mix(in srgb, var(--content-color, CanvasText) 12%, transparent);
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .more:hover,
    .more:focus-visible {
        background: color-mix(in srgb, var(--content-color, CanvasText) 22%, transparent);
        outline: none;
    }

    .more svg {
        width: 60%;
        height: 60%;
    }

    /* Menü mit den Zusatzvariablen */
    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5em;
        padding: 4px;
    }

    .overlay[hidden] {
        display: none;
    }

    .overlay-title {
        flex: 0 0 auto;
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .extras {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 0.9em;
        width: 100%;
        max-width: 480px;
        min-height: 0;
        overflow-y: auto;
        padding: 0.2em 0.4em;
    }

    .extra {
        display: flex;
        flex-direction: column;
        gap: 0.35em;
    }

    .extra[data-available="false"] {
        opacity: 0.4;
        pointer-events: none;
    }

    .extra-head {
        display: flex;
        justify-content: space-between;
        gap: 0.8em;
    }

    .extra-label,
    .extra-value {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .extra-value {
        flex: 0 0 auto;
        max-width: 50%;
        opacity: 0.7;
    }

    .extra input[type="range"] {
        width: 100%;
        margin: 0.2em 0;
        accent-color: var(--accent-color, currentColor);
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4em;
    }

    .overlay > .actions {
        flex: 0 0 auto;
        justify-content: center;
    }

    .action {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        min-height: 2.2em;
        padding: 0.3em 0.85em;
        border: 0;
        border-radius: 1.1em;
        background: color-mix(in srgb, var(--action-color, var(--content-color, CanvasText)) 14%, transparent);
        color: inherit;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .action:hover {
        background: color-mix(in srgb, var(--action-color, var(--content-color, CanvasText)) 24%, transparent);
    }

    .action:focus-visible {
        outline: 2px solid var(--accent-color, currentColor);
        outline-offset: -2px;
    }

    /* Aktueller Wert einer Aufzählung bzw. eingeschalteter Umschalter */
    .action[data-active="true"] {
        background: color-mix(in srgb, var(--action-color, var(--accent-color, currentColor)) 34%, transparent);
        box-shadow: inset 0 0 0 1.5px var(--action-color, var(--accent-color, currentColor));
    }

    .action .action-icon {
        color: var(--action-color, currentColor);
        line-height: 1;
    }

    .action.close {
        background: none;
        opacity: 0.75;
    }
</style>

<main class="grid" id="grid"></main>
<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="extras" id="overlay-extras"></div>
    <div class="actions" id="overlay-actions"></div>
</div>

<script>
    "use strict";

    const grid = document.getElementById("grid");
    const DEFAULT_ICON = "power-off";
    let state = { type: "full", all: { show: false }, entries: [] };
    // Variablen-ID => Liste der Buttons (eine Variable kann mehrfach verknüpft sein)
    let buttonsById = new Map();
    let allButton = null;
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayExtras = document.getElementById("overlay-extras");
    const overlayActions = document.getElementById("overlay-actions");
    // Variablen-ID => Aktualisierungsfunktionen der Zeilen im geöffneten Menü
    let extraRows = new Map();

    function validIcon(name) {
        return typeof name === "string" && /^[a-z0-9-]+$/.test(name) ? name : DEFAULT_ICON;
    }

    function isImage(value) {
        return typeof value === "string" && value.startsWith("data:image/");
    }

    // Maße der Beschriftung unter dem Quadrat; wächst mit der Schaltfläche, höchstens etwas über die Designschrift.
    function labelMetrics(size, withLabels) {
        if (!withLabels) {
            return { fontSize: 0, height: 0, gap: 0 };
        }
        const base = parseFloat(getComputedStyle(document.body).fontSize) || 14;
        const fontSize = Math.max(10, Math.min(size * 0.14, base * 1.15));
        return { fontSize, height: Math.ceil(fontSize * 1.25), gap: Math.max(2, Math.round(size * 0.05)) };
    }

    // Wählt die Spaltenzahl, bei der die quadratischen Schaltflächen (inkl. Beschriftung darunter) am größten werden.
    function layoutGrid() {
        const count = Math.max(1, Number(grid.dataset.count) || 1);
        const withLabels = grid.dataset.labels === "true";
        const width = grid.clientWidth;
        const height = grid.clientHeight;
        const gap = Math.max(6, Math.min(14, Math.min(width, height) * 0.03 + 2));
        let best = { columns: 1, rows: count, size: -1 };
        for (let columns = 1; columns <= count; columns++) {
            const rows = Math.ceil(count / columns);
            const cellHeight = (height - (rows - 1) * gap) / rows;
            let size = Math.min((width - (columns - 1) * gap) / columns, cellHeight);
            // Die Beschriftungshöhe hängt von der Größe ab; wenige Schritte genügen zur Annäherung.
            for (let i = 0; i < 4; i++) {
                const label = labelMetrics(size, withLabels);
                size = Math.min((width - (columns - 1) * gap) / columns, cellHeight - label.height - label.gap);
            }
            if (size > best.size) {
                best = { columns, rows, size };
            }
        }
        // 1 px Reserve gegen Rundung der Beschriftungshöhe
        const size = Math.max(0, Math.floor(best.size) - 1);
        const label = labelMetrics(size, withLabels);
        // Begrenzt die Breite die Größe, füllen die Schaltflächen die Höhe bis zum unteren Rand (höchstens 30 % höher als breit).
        const rowHeight = (height - (best.rows - 1) * gap) / best.rows;
        const faceHeight = Math.max(size, Math.min(Math.floor(rowHeight - label.height - label.gap) - 1, Math.round(size * 1.3)));
        grid.style.setProperty("--gap", gap + "px");
        grid.style.setProperty("--columns", String(best.columns));
        grid.style.setProperty("--size", size + "px");
        grid.style.setProperty("--face-height", faceHeight + "px");
        grid.style.setProperty("--label-size", label.fontSize + "px");
        grid.style.setProperty("--label-height", label.height + "px");
        grid.style.setProperty("--label-gap", label.gap + "px");
        grid.style.setProperty("--more-size", Math.round(Math.max(22, Math.min(36, size * 0.26))) + "px");
    }

    function iconElement(name) {
        const icon = document.createElement("i");
        icon.className = "fa-light fa-" + validIcon(name);
        return icon;
    }

    // Erzeugt einen Button mit Grafik und optionaler Beschriftung; Beschriftung nur als Text.
    function createButton(text, showLabel) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "switch";
        const face = document.createElement("span");
        face.className = "face";
        const graphic = document.createElement("span");
        graphic.className = "graphic";
        face.append(graphic);
        button.append(face);
        if (showLabel) {
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = text;
            button.append(label);
        }
        button.dataset.label = String(showLabel);
        button.title = text;
        button.setAttribute("aria-label", text);
        return button;
    }

    function pressFeedback(button) {
        button.dataset.pressed = "true";
        window.setTimeout(() => delete button.dataset.pressed, 300);
    }

    // Grafik eines Eintrags passend zum Zustand setzen; Bilder werden nur bei Bedarf ausgetauscht.
    function applyEntryState(button, entry) {
        const on = entry.available === true && entry.on === true;
        button.dataset.on = String(on);
        button.disabled = entry.available !== true;
        button.setAttribute("aria-pressed", String(on));
        if (!isImage(entry.imageOn)) {
            return;
        }
        const image = button.querySelector(".graphic img");
        const source = !on && isImage(entry.imageOff) ? entry.imageOff : entry.imageOn;
        if (image && image.getAttribute("src") !== source) {
            image.src = source;
        }
    }

    function anyIncludedOn() {
        return state.entries.some((entry) => entry.includeInAll === true && entry.available === true && entry.on === true);
    }

    function hasIncludedAvailable() {
        return state.entries.some((entry) => entry.includeInAll === true && entry.available === true);
    }

    function allText() {
        const custom = typeof state.all.label === "string" ? state.all.label.trim() : "";
        if (custom !== "") {
            return custom;
        }
        return anyIncludedOn() ? translate("All off") : translate("All on");
    }

    function applyAllState() {
        if (!allButton) {
            return;
        }
        const on = anyIncludedOn();
        const text = allText();
        allButton.dataset.on = String(on);
        allButton.disabled = !hasIncludedAvailable();
        allButton.setAttribute("aria-pressed", String(on));
        allButton.title = text;
        allButton.setAttribute("aria-label", text);
        const label = allButton.querySelector(".label");
        if (label) {
            label.textContent = text;
        }
    }

    function renderFull() {
        const entries = Array.isArray(state.entries) ? state.entries : [];
        const showAll = state.all && state.all.show === true && entries.length > 0;
        closeExtras();
        grid.replaceChildren();
        buttonsById = new Map();
        allButton = null;
        grid.dataset.count = String(entries.length + (showAll ? 1 : 0));
        // Platz für Beschriftungen nur reservieren, wenn mindestens eine angezeigt wird (Alle an/aus hat immer eine).
        grid.dataset.labels = String(showAll || entries.some((entry) => entry.showLabel !== false));
        layoutGrid();

        if (entries.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = translate("No actuators configured");
            grid.append(empty);
            return;
        }

        // Alle an/aus steht immer an erster Stelle.
        if (showAll) {
            allButton = createButton(allText(), true);
            allButton.dataset.hasOffImage = "false";
            allButton.querySelector(".graphic").append(iconElement(state.all.icon));
            allButton.addEventListener("click", () => {
                pressFeedback(allButton);
                requestAction("All", true);
            });
            grid.append(allButton);
        }

        entries.forEach((entry) => {
            const text = entry.available === true ? String(entry.label) : String(entry.label || translate("Not available"));
            const hasImage = isImage(entry.imageOn);
            // Ohne Bild und ohne Beschriftung wäre der Button bei gleichen Icons nicht zuzuordnen; daher bleibt der Text als Tooltip.
            const button = createButton(text, entry.showLabel !== false);
            const graphic = button.querySelector(".graphic");
            button.dataset.hasOffImage = String(hasImage && isImage(entry.imageOff));
            if (hasImage) {
                const image = document.createElement("img");
                image.alt = "";
                image.src = entry.imageOn;
                graphic.append(image);
            } else {
                graphic.append(iconElement(entry.icon));
                if (typeof entry.color === "string" && /^#[0-9A-Fa-f]{6}$/.test(entry.color)) {
                    button.style.setProperty("--on-color", entry.color);
                }
            }
            applyEntryState(button, entry);
            button.addEventListener("click", () => {
                pressFeedback(button);
                requestAction("Toggle", Number(entry.id));
            });
            const list = buttonsById.get(entry.id) || [];
            list.push({ button, entry });
            buttonsById.set(entry.id, list);
            if (Array.isArray(entry.extras) && entry.extras.length > 0) {
                grid.append(extrasCell(button, entry));
            } else {
                grid.append(button);
            }
        });
        applyAllState();
    }

    // Nur Schaltzustände aktualisieren, ohne die Bilder erneut zu übertragen oder das Raster neu aufzubauen.
    function applyStates(states) {
        states.forEach((item) => {
            (buttonsById.get(item.id) || []).forEach(({ button, entry }) => {
                const wasAvailable = entry.available;
                entry.available = item.available === true;
                entry.on = item.on === true;
                applyEntryState(button, entry);
                if (wasAvailable !== entry.available && entry.available !== true) {
                    button.title = entry.label || translate("Not available");
                }
            });
        });
        applyAllState();
    }

    // --------- Zusatzvariablen (Pfeil-Menü) ---------

    function chevronElement() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M6 9l6 6 6-6");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "2.5");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
    }

    function extrasCell(button, entry) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const more = document.createElement("button");
        more.type = "button";
        more.className = "more";
        more.title = translate("More settings");
        more.setAttribute("aria-label", translate("More settings"));
        more.setAttribute("aria-haspopup", "dialog");
        more.append(chevronElement());
        more.addEventListener("click", () => openExtras(entry));
        cell.append(button, more);
        return cell;
    }

    function sendExtra(extra, value) {
        requestAction("Extra", JSON.stringify({ variable: Number(extra.id), value }));
    }

    function sameValue(a, b) {
        return typeof a === "number" && typeof b === "number" && Math.abs(a - b) < 1e-9;
    }

    function formatSlider(control, value) {
        const digits = Number(control.digits) || 0;
        const number = Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
        return String(control.prefix || "") + number + String(control.suffix || "");
    }

    function pillButton(caption, icon, color) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "action";
        if (typeof color === "string" && /^#[0-9A-Fa-f]{6}$/.test(color)) {
            button.style.setProperty("--action-color", color);
        }
        if (typeof icon === "string" && icon !== "") {
            const span = document.createElement("span");
            span.className = "action-icon";
            span.append(iconElement(icon));
            button.append(span);
        }
        const text = document.createElement("span");
        text.textContent = String(caption);
        button.append(text);
        return button;
    }

    // Eine Zeile je Zusatzvariable: Beschriftung, aktueller Wert und Bedienelement nach Art der Variable.
    function extraRow(extra) {
        const row = document.createElement("div");
        row.className = "extra";
        const head = document.createElement("div");
        head.className = "extra-head";
        const label = document.createElement("span");
        label.className = "extra-label";
        label.textContent = String(extra.label || "");
        const valueText = document.createElement("span");
        valueText.className = "extra-value";
        head.append(label, valueText);
        row.append(head);

        const control = extra.control && typeof extra.control === "object" ? extra.control : null;
        let updateControl = () => {};
        if (control && control.type === "toggle") {
            const actions = document.createElement("div");
            actions.className = "actions";
            const toggle = pillButton(translate("On"), "", "");
            toggle.setAttribute("role", "switch");
            toggle.addEventListener("click", () => sendExtra(extra, extra.value !== true));
            actions.append(toggle);
            row.append(actions);
            updateControl = () => {
                toggle.dataset.active = String(extra.value === true);
                toggle.setAttribute("aria-checked", String(extra.value === true));
                toggle.querySelector("span").textContent = translate(extra.value === true ? "On" : "Off");
            };
        } else if (control && control.type === "buttons" && Array.isArray(control.options)) {
            const actions = document.createElement("div");
            actions.className = "actions";
            const buttons = control.options.map((option) => {
                const button = pillButton(option.caption, option.icon, option.color);
                button.addEventListener("click", () => sendExtra(extra, option.value));
                actions.append(button);
                return { button, option };
            });
            row.append(actions);
            updateControl = () => buttons.forEach(({ button, option }) => (button.dataset.active = String(sameValue(option.value, extra.value))));
        } else if (control && control.type === "slider") {
            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = String(control.min);
            slider.max = String(control.max);
            slider.step = String(control.step);
            slider.setAttribute("aria-label", String(extra.label || ""));
            let dragging = false;
            slider.addEventListener("input", () => {
                dragging = true;
                valueText.textContent = formatSlider(control, slider.value);
            });
            slider.addEventListener("change", () => {
                dragging = false;
                sendExtra(extra, Number(slider.value));
            });
            row.append(slider);
            updateControl = () => {
                if (!dragging && typeof extra.value === "number") {
                    slider.value = String(extra.value);
                }
            };
        }

        const update = () => {
            const available = extra.available === true && control !== null;
            row.dataset.available = String(available);
            valueText.textContent = available ? String(extra.text || "") : translate("Not available");
            updateControl();
        };
        update();
        extraRows.set(extra.id, (extraRows.get(extra.id) || []).concat([update]));
        return row;
    }

    function openExtras(entry) {
        extraRows = new Map();
        overlayTitle.textContent = String(entry.label || "");
        overlayExtras.replaceChildren(...entry.extras.map(extraRow));
        const close = pillButton(translate("Close"), "", "");
        close.classList.add("close");
        close.addEventListener("click", closeExtras);
        overlayActions.replaceChildren(close);
        overlay.setAttribute("aria-label", String(entry.label || ""));
        overlay.hidden = false;
        grid.dataset.dimmed = "true";
        const first = overlayExtras.querySelector("button, input") || close;
        first.focus({ preventScroll: true });
    }

    function closeExtras() {
        overlay.hidden = true;
        extraRows = new Map();
        overlayExtras.replaceChildren();
        overlayActions.replaceChildren();
        delete grid.dataset.dimmed;
    }

    // Werte der Zusatzvariablen übernehmen (eine Variable kann bei mehreren Aktoren stehen).
    function applyExtras(items) {
        const entries = Array.isArray(state.entries) ? state.entries : [];
        items.forEach((item) => {
            if (!item || typeof item !== "object") {
                return;
            }
            entries.forEach((entry) => {
                (Array.isArray(entry.extras) ? entry.extras : []).forEach((extra) => {
                    if (extra.id === item.id) {
                        extra.available = item.available === true;
                        extra.value = item.value;
                        extra.text = item.text;
                    }
                });
            });
            (extraRows.get(item.id) || []).forEach((update) => update());
        });
    }

    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
            closeExtras();
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) {
            closeExtras();
        }
    });

    function handleMessage(data) {
        let message = data;
        if (typeof message === "string") {
            try {
                message = JSON.parse(message);
            } catch (error) {
                return;
            }
        }
        if (!message || typeof message !== "object" || Array.isArray(message)) {
            return;
        }
        if (message.type === "states" && Array.isArray(message.states)) {
            applyStates(message.states);
            if (Array.isArray(message.extras)) {
                applyExtras(message.extras);
            }
        } else if (message.type === "full") {
            state = message;
            if (!state.all || typeof state.all !== "object") {
                state.all = { show: false };
            }
            renderFull();
        }
    }

    new ResizeObserver(layoutGrid).observe(grid);
    handleMessage(__QUICKSWITCH_INITIAL_STATE__);
</script>
