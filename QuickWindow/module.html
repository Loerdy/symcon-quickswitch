<script src="/icons.js"></script>
<style>
    /* Abstände und Schrift setzt die Visualisierung am body, deshalb body-Margins nicht überschreiben.
       Als Flex-Element füllt body den Rest abzüglich dieser Margins. */
    html {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    body {
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        color: var(--content-color, CanvasText);
    }

    * {
        box-sizing: border-box;
    }

    /* Feste Zustandsfarben */
    :root {
        --color-open: #F0A30A;
        --color-tilted: #0EA5E9;
        --color-alert: #E5484D;
        /* Normalzustand ohne Färbung, wie Aus bei QuickSwitch */
        --color-neutral: color-mix(in srgb, var(--disabled-color, var(--content-color, CanvasText)) 45%, transparent);
    }

    /* Zusammenfassung über dem Raster */
    .summary {
        flex: 0 0 auto;
        padding-bottom: 0.4em;
        overflow: hidden;
        font-weight: 600;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: opacity 0.15s ease;
    }

    .summary[hidden] {
        display: none;
    }

    .summary[data-alert="true"] {
        color: var(--color-open);
    }

    .grid {
        display: grid;
        /* Spalten, Maße und Beschriftungshöhe setzt layoutGrid() (wie bei QuickSwitch und QuickLock). */
        grid-template-columns: repeat(var(--columns, 1), var(--face-width, var(--size, 64px)));
        grid-auto-rows: auto;
        justify-content: center;
        align-content: center;
        gap: var(--gap, 8px);
        flex: 1;
        min-height: 0;
        width: 100%;
        transition: opacity 0.15s ease;
    }

    /* Bei geöffnetem Menü bzw. geöffneter Rückfrage tritt das Raster zurück. */
    body[data-dimmed="true"] .grid,
    body[data-dimmed="true"] .summary {
        opacity: 0.08;
        pointer-events: none;
    }

    .cell {
        position: relative;
        width: var(--face-width, var(--size, 64px));
        min-width: 0;
    }

    /* Schaltfläche = Fläche mit Grafik, darunter Beschriftung und Zustand */
    .opening {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--label-gap, 4px);
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: default;
        -webkit-tap-highlight-color: transparent;
    }

    .cell[data-menu="true"] .opening {
        cursor: pointer;
    }

    .opening:focus-visible,
    .mini:focus-visible,
    .action:focus-visible {
        outline: none;
    }

    .opening:focus-visible .face,
    .mini:focus-visible,
    .action:focus-visible {
        outline: 2px solid var(--accent-color, currentColor);
        outline-offset: -2px;
    }

    .opening:disabled {
        opacity: 0.4;
    }

    .face {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: var(--face-width, var(--size, 64px));
        height: var(--face-height, var(--size, 64px));
        overflow: hidden;
        padding: calc(var(--size, 64px) * 0.1);
        border-radius: calc(var(--size, 64px) * 0.16);
        background: color-mix(in srgb, var(--content-color, CanvasText) 6%, transparent);
        transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    /* Hat eine Schaltfläche eine Leiste für Griffe und Schlösser, bleibt in allen unten Platz frei,
       damit die Icons überall gleich groß und gleich ausgerichtet sind. */
    .grid[data-has-controls="true"] .face {
        padding-bottom: calc(var(--mini-size, 24px) + var(--size, 64px) * 0.12);
    }

    .cell[data-menu="true"] .opening:hover .face {
        background: color-mix(in srgb, var(--content-color, CanvasText) 10%, transparent);
    }

    /* Nur ungewollte Zustände: Fläche in der Zustandsfarbe hinterlegt; geschlossen bleibt grau. */
    .cell:is([data-state="open"], [data-state="tilted"], [data-state="forced"]) .face {
        background: color-mix(in srgb, var(--state-color) 16%, transparent);
    }

    .cell[data-menu="true"]:is([data-state="open"], [data-state="tilted"], [data-state="forced"]) .opening:hover .face {
        background: color-mix(in srgb, var(--state-color) 24%, transparent);
    }

    .cell[data-menu="true"] .opening:active .face,
    .opening[data-pressed="true"] .face {
        transform: scale(0.97);
    }

    .cell[data-failed="true"] .face {
        box-shadow: inset 0 0 0 2px var(--color-alert);
    }

    .graphic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
        /* icons.js ersetzt das <i> durch ein SVG mit 1em Höhe; die Schriftgröße skaliert damit das Icon. */
        font-size: min(calc(var(--size, 64px) * 0.58), calc(var(--face-height, 64px) * 0.6));
        color: var(--state-color);
        transition: color 0.2s ease, opacity 0.2s ease;
    }

    .grid[data-has-controls="true"] .graphic {
        font-size: min(calc(var(--size, 64px) * 0.52), calc((var(--face-height, 64px) - var(--mini-size, 24px)) * 0.55));
    }

    .cell[data-state="closed"] {
        --state-color: var(--color-neutral);
    }

    .cell[data-state="open"] {
        --state-color: var(--color-open);
    }

    .cell[data-state="tilted"] {
        --state-color: var(--color-tilted);
    }

    .cell[data-state="forced"] {
        --state-color: var(--color-alert);
    }

    .cell[data-state="unknown"] {
        --state-color: var(--disabled-color, currentColor);
    }

    .cell[data-state="unknown"] .graphic {
        opacity: 0.45;
    }

    /* Leiste mit Griffen und Schlössern unten in der Fläche; nur die Schloss-Buttons fangen Klicks ab. */
    .controls {
        position: absolute;
        top: calc(var(--face-height, 64px) - var(--mini-size, 24px) - var(--size, 64px) * 0.07);
        left: 0;
        display: flex;
        justify-content: center;
        gap: calc(var(--mini-size, 24px) * 0.45);
        width: var(--face-width, var(--size, 64px));
        pointer-events: none;
    }

    .group {
        display: flex;
        gap: calc(var(--mini-size, 24px) * 0.12);
    }

    .mini {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--mini-size, 24px);
        height: var(--mini-size, 24px);
        padding: 0;
        border: 0;
        border-radius: 30%;
        background: color-mix(in srgb, var(--mini-color, var(--content-color, CanvasText)) 18%, transparent);
        color: var(--mini-color, inherit);
        font: inherit;
        font-size: calc(var(--mini-size, 24px) * 0.55);
        line-height: 1;
        -webkit-tap-highlight-color: transparent;
    }

    .mini[data-state="closed"] {
        --mini-color: var(--color-neutral);
    }

    .mini[data-state="open"] {
        --mini-color: var(--color-open);
    }

    .mini[data-state="tilted"] {
        --mini-color: var(--color-tilted);
    }

    .mini:is([data-state="fault"], [data-state="forced"], [data-state="unlocked"]) {
        --mini-color: var(--color-alert);
    }

    .mini[data-state="locked"] {
        --mini-color: var(--color-neutral);
    }

    .mini[data-state="unknown"] {
        --mini-color: var(--disabled-color, currentColor);
        opacity: 0.5;
    }

    button.mini {
        pointer-events: auto;
        cursor: pointer;
    }

    button.mini:hover {
        background: color-mix(in srgb, var(--mini-color, var(--content-color, CanvasText)) 30%, transparent);
    }

    button.mini:disabled {
        cursor: default;
        opacity: 0.55;
    }

    .mini[data-failed="true"] {
        box-shadow: inset 0 0 0 2px var(--color-alert);
    }

    /* Befehl gesendet, Rückmeldung des Schlosses steht noch aus */
    .mini[data-pending="true"],
    .handle-row[data-pending="true"] .action {
        animation: pending 1.1s ease-in-out infinite;
    }

    @keyframes pending {
        50% {
            opacity: 0.3;
        }
    }

    .label {
        flex: 0 0 auto;
        width: 100%;
        height: var(--line-height, 1.2em);
        overflow: hidden;
        font-size: var(--label-size, 12px);
        line-height: var(--line-height, 1.2em);
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .label + .label {
        margin-top: calc(var(--label-gap, 4px) * -1);
    }

    .status-text {
        opacity: 0.7;
    }

    .cell:is([data-state="open"], [data-state="tilted"], [data-state="forced"]) .status-text {
        color: var(--state-color);
        opacity: 1;
    }

    .empty {
        display: grid;
        place-items: center;
        grid-column: 1 / -1;
        grid-row: 1 / -1;
        opacity: 0.6;
        text-align: center;
    }

    /* Menü und Rückfrage liegen über dem abgedunkelten Raster */
    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        padding: 4px;
        overflow-y: auto;
        text-align: center;
    }

    .overlay[hidden] {
        display: none;
    }

    .overlay-title {
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .overlay-text {
        opacity: 0.75;
    }

    .handle-list {
        display: flex;
        flex-direction: column;
        gap: 0.4em;
        width: min(100%, 26em);
    }

    .handle-list:empty {
        display: none;
    }

    .handle-row {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.3em 0.3em 0.3em 0.7em;
        border-radius: 0.8em;
        background: color-mix(in srgb, var(--content-color, CanvasText) 6%, transparent);
        text-align: left;
    }

    .handle-row[data-failed="true"] {
        box-shadow: inset 0 0 0 2px var(--color-alert);
    }

    .handle-row[data-available="false"] {
        opacity: 0.4;
    }

    .handle-info {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
    }

    .handle-name,
    .handle-state {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .handle-state {
        font-size: 0.85em;
        opacity: 0.75;
    }

    .handle-state[data-alert="true"] {
        color: var(--color-open);
        opacity: 1;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5em;
        max-width: 100%;
    }

    .action {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 0.45em;
        min-height: 2.4em;
        padding: 0.35em 0.9em;
        border: 0;
        border-radius: 1.2em;
        background: color-mix(in srgb, var(--action-color, var(--content-color, CanvasText)) 16%, transparent);
        color: inherit;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .action:hover {
        background: color-mix(in srgb, var(--action-color, var(--content-color, CanvasText)) 26%, transparent);
    }

    .action:disabled {
        cursor: default;
        opacity: 0.4;
    }

    .action .action-icon {
        color: var(--action-color, currentColor);
        line-height: 1;
    }

    .action.cancel {
        background: none;
        opacity: 0.75;
    }
</style>

<div class="summary" id="summary" hidden></div>
<main class="grid" id="grid"></main>
<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-text" id="overlay-text"></div>
    <div class="handle-list" id="overlay-handles"></div>
    <div class="actions" id="overlay-actions"></div>
</div>

<script>
    "use strict";

    const summary = document.getElementById("summary");
    const grid = document.getElementById("grid");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const overlayHandles = document.getElementById("overlay-handles");
    const overlayActions = document.getElementById("overlay-actions");

    // Werte des Verriegelungsstatus (Matter DoorLock_LockState) und Aktionen des Moduls je Befehlswert
    const LOCK_NOT_FULLY_LOCKED = 0;
    const LOCK_LOCKED = 1;
    const COMMAND_IDENTS = { 0: "Open", 1: "Unlock", 2: "Lock" };
    // Spätestens dann gilt ein gesendeter Befehl als abgeschlossen, auch ohne Rückmeldung.
    const PENDING_TIMEOUT = 30000;
    const DEFAULT_ICON = { window: "window-frame", door: "door-closed" };
    // Griff als Pfeil in seiner Richtung: unten = geschlossen, waagerecht = offen, oben = gekippt
    const POSITION_ICONS = { closed: "arrow-down", open: "arrow-right", tilted: "arrow-up", fault: "triangle-exclamation", forced: "triangle-exclamation" };
    const ALERT_STATES = ["open", "tilted", "forced"];

    let state = { type: "full", showStatus: false, showSummary: false, summary: "", openings: [] };
    // Index der Öffnung => Elemente der Zelle
    let items = [];
    // Aktionsvariable eines Schlosses => { lockStatus, timer } eines gesendeten Befehls
    const pendingById = new Map();
    const failedIds = new Set();
    // Offenes Overlay: { index, mode: "menu" | "confirm" }
    let overlayView = null;

    function validIcon(name, fallback) {
        return typeof name === "string" && /^[a-z0-9-]+$/.test(name) ? name : fallback;
    }

    function validColor(value) {
        return typeof value === "string" && /^#[0-9A-Fa-f]{6}$/.test(value) ? value : "";
    }

    function iconElement(name, fallback) {
        const icon = document.createElement("i");
        icon.className = "fa-light fa-" + validIcon(name, fallback);
        return icon;
    }

    // Icon nur bei Änderung austauschen (icons.js ersetzt das <i> durch ein SVG).
    function setIcon(element, name, fallback) {
        const icon = validIcon(name, fallback);
        if (element.dataset.icon !== icon) {
            element.dataset.icon = icon;
            element.replaceChildren(iconElement(icon, fallback));
        }
    }

    function handlesOf(opening) {
        return Array.isArray(opening.handles) ? opening.handles : [];
    }

    function isLockable(handle) {
        return handle.available === true && handle.lockable === true;
    }

    function canLock(handle) {
        return isLockable(handle) && handle.lockAllowed === true && handle.lockStatus !== LOCK_LOCKED;
    }

    function controlCount(opening) {
        return handlesOf(opening).reduce((sum, handle) => sum + (handle.hasPosition === true ? 1 : 0) + (handle.lockable === true ? 1 : 0), 0);
    }

    // Maße der Beschriftungszeilen unter der Fläche; wachsen mit der Schaltfläche, höchstens etwas über die Designschrift.
    function labelMetrics(size, lines) {
        if (lines === 0) {
            return { fontSize: 0, lineHeight: 0, height: 0, gap: 0 };
        }
        const base = parseFloat(getComputedStyle(document.body).fontSize) || 14;
        const fontSize = Math.max(10, Math.min(size * 0.14, base * 1.15));
        const lineHeight = Math.ceil(fontSize * 1.25);
        return { fontSize, lineHeight, height: lineHeight * lines, gap: Math.max(2, Math.round(size * 0.05)) };
    }

    // Wählt die Spaltenzahl, bei der die Schaltflächen (inkl. Beschriftung darunter) am größten werden.
    function layoutGrid() {
        const count = Math.max(1, Number(grid.dataset.count) || 1);
        const lines = Number(grid.dataset.lines) || 0;
        const width = grid.clientWidth;
        const height = grid.clientHeight;
        // Abstand nach der Kachelbreite: gleich breite Quick-Kacheln haben denselben Abstand.
        const gap = Math.max(6, Math.min(14, width * 0.03 + 2));
        let best = { columns: 1, rows: count, size: -1 };
        for (let columns = 1; columns <= count; columns++) {
            const rows = Math.ceil(count / columns);
            const cellHeight = (height - (rows - 1) * gap) / rows;
            let size = Math.min((width - (columns - 1) * gap) / columns, cellHeight);
            for (let i = 0; i < 4; i++) {
                const label = labelMetrics(size, lines);
                size = Math.min((width - (columns - 1) * gap) / columns, cellHeight - label.height - label.gap);
            }
            if (size > best.size) {
                best = { columns, rows, size };
            }
        }
        const size = Math.max(0, Math.floor(best.size) - 1);
        const label = labelMetrics(size, lines);
        const rowHeight = (height - (best.rows - 1) * gap) / best.rows;
        // Begrenzt die Breite die Größe, füllen die Schaltflächen die Höhe (höchstens doppelt so hoch wie breit).
        const faceHeight = Math.max(size, Math.min(Math.floor(rowHeight - label.height - label.gap) - 1, size * 2));
        // Begrenzt die Höhe die Größe, füllen die Schaltflächen die Breite (höchstens 60 % breiter als hoch).
        const columnWidth = (width - (best.columns - 1) * gap) / best.columns;
        const faceWidth = Math.max(size, Math.min(Math.floor(columnWidth) - 1, Math.round(faceHeight * 1.6)));
        // Leiste: alle Griffe und Schlösser der vollsten Schaltfläche passen nebeneinander in die Fläche.
        const controls = Number(grid.dataset.controls) || 0;
        const groups = Number(grid.dataset.groups) || 1;
        const fit = controls > 0 ? (faceWidth * 0.9) / (controls + 0.12 * (controls - groups) + 0.45 * (groups - 1)) : 0;
        const mini = Math.round(Math.max(16, Math.min(44, size * 0.3, fit)));
        grid.style.setProperty("--gap", gap + "px");
        grid.style.setProperty("--columns", String(best.columns));
        grid.style.setProperty("--size", size + "px");
        grid.style.setProperty("--face-width", faceWidth + "px");
        grid.style.setProperty("--face-height", faceHeight + "px");
        grid.style.setProperty("--label-size", label.fontSize + "px");
        grid.style.setProperty("--line-height", label.lineHeight + "px");
        grid.style.setProperty("--label-gap", label.gap + "px");
        grid.style.setProperty("--mini-size", mini + "px");
    }

    function pressFeedback(button) {
        button.dataset.pressed = "true";
        window.setTimeout(() => delete button.dataset.pressed, 300);
    }

    // --------- Befehle ---------

    // Öffnung, zu der ein Schloss (Aktionsvariable) gehört
    function itemOfLock(lockId) {
        return items.find((item) => handlesOf(item.opening).some((handle) => handle.lockId === lockId)) || null;
    }

    function refreshControls(item) {
        if (!item) {
            return;
        }
        item.controls.forEach((control) => applyControlState(control));
        item.cell.setAttribute("aria-busy", String(handlesOf(item.opening).some((handle) => pendingById.has(handle.lockId))));
    }

    function clearPending(lockId) {
        const pending = pendingById.get(lockId);
        if (pending) {
            window.clearTimeout(pending.timer);
            pendingById.delete(lockId);
        }
        refreshControls(itemOfLock(lockId));
        refreshOverlay();
    }

    function setPending(handle) {
        clearPending(handle.lockId);
        const timer = window.setTimeout(() => clearPending(handle.lockId), PENDING_TIMEOUT);
        pendingById.set(handle.lockId, { lockStatus: handle.lockStatus, timer });
        refreshControls(itemOfLock(handle.lockId));
        refreshOverlay();
    }

    function showFailed(lockId) {
        clearPending(lockId);
        const item = itemOfLock(lockId);
        if (!item) {
            return;
        }
        failedIds.add(lockId);
        item.cell.dataset.failed = "true";
        refreshControls(item);
        refreshOverlay();
        window.setTimeout(() => {
            failedIds.delete(lockId);
            delete item.cell.dataset.failed;
            refreshControls(item);
            refreshOverlay();
        }, 2500);
    }

    function sendCommand(handle, command) {
        requestAction(COMMAND_IDENTS[command.value], Number(handle.lockId));
        // Ist das Schloss schon im Zielzustand, kommt keine Statusänderung; dann nichts als laufend anzeigen.
        if (!(command.value === 2 && handle.lockStatus === LOCK_LOCKED)) {
            setPending(handle);
        }
    }

    // Aufschließen bzw. Öffnen ggf. mit Rückfrage; Verriegeln nur, wenn erlaubt.
    function runCommand(item, handle, command, returnToMenu) {
        if (!command || !isLockable(handle)) {
            return;
        }
        if (command.value === 2) {
            if (canLock(handle)) {
                sendCommand(handle, command);
            }
            return;
        }
        if (handle.confirmOpen === true) {
            showConfirmation(item, handle, command, returnToMenu);
        } else {
            sendCommand(handle, command);
        }
    }

    // Schloss-Button in der Leiste: verriegelt => aufschließen, sonst verriegeln
    function toggleLock(item, handle) {
        const commands = handle.commands || {};
        runCommand(item, handle, handle.lockStatus === LOCK_LOCKED ? commands.unlock : commands.lock, false);
    }

    function lockAll(item) {
        const handles = handlesOf(item.opening).filter(canLock);
        if (handles.length === 0) {
            return;
        }
        requestAction("LockAll", Number(item.opening.id));
        handles.forEach(setPending);
    }

    // --------- Leiste mit Griffen und Schlössern ---------

    function lockState(handle) {
        if (!isLockable(handle)) {
            return "unknown";
        }
        if (handle.lockStatus === LOCK_LOCKED) {
            return "locked";
        }
        return handle.lockStatus === LOCK_NOT_FULLY_LOCKED ? "fault" : "unlocked";
    }

    function applyControlState(control) {
        const { element, handle, kind } = control;
        const available = handle.available === true;
        if (kind === "position") {
            const positionState = available ? String(handle.positionState || "unknown") : "unknown";
            element.dataset.state = positionState;
            setIcon(element, POSITION_ICONS[positionState] || "question", "question");
            element.title = String(handle.label || "") + (available ? " – " + String(handle.positionText || "") : "");
            return;
        }
        const stateName = lockState(handle);
        element.dataset.state = stateName;
        setIcon(element, stateName === "locked" ? "lock" : stateName === "unlocked" ? "lock-open" : "lock", "lock");
        element.disabled = !isLockable(handle) || (handle.lockStatus !== LOCK_LOCKED && !canLock(handle));
        if (pendingById.has(handle.lockId)) {
            element.dataset.pending = "true";
        } else {
            delete element.dataset.pending;
        }
        if (failedIds.has(handle.lockId)) {
            element.dataset.failed = "true";
        } else {
            delete element.dataset.failed;
        }
        const hint = element.disabled && isLockable(handle) ? " – " + translate("Close the handle to lock") : "";
        const title = String(handle.label || "") + (available ? " – " + String(handle.lockText || "") : "") + hint;
        element.title = title;
        element.setAttribute("aria-label", title);
    }

    function buildControls(item) {
        const container = document.createElement("div");
        container.className = "controls";
        handlesOf(item.opening).forEach((handle) => {
            const group = document.createElement("span");
            group.className = "group";
            if (handle.hasPosition === true) {
                const indicator = document.createElement("span");
                indicator.className = "mini";
                indicator.setAttribute("aria-hidden", "true");
                group.append(indicator);
                item.controls.push({ element: indicator, handle, kind: "position" });
            }
            if (handle.lockable === true) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "mini";
                button.addEventListener("click", () => toggleLock(item, handle));
                group.append(button);
                item.controls.push({ element: button, handle, kind: "lock" });
            }
            if (group.childElementCount > 0) {
                container.append(group);
            }
        });
        return container;
    }

    // --------- Menü und Rückfrage ---------

    function actionButton(command, fallbackCaption, fallbackIcon) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "action";
        const color = command ? validColor(command.color) : "";
        if (color !== "") {
            button.style.setProperty("--action-color", color);
        }
        const icon = document.createElement("span");
        icon.className = "action-icon";
        icon.append(iconElement(command && command.icon, fallbackIcon));
        button.append(icon);
        const caption = document.createElement("span");
        caption.textContent = command && command.caption ? String(command.caption) : fallbackCaption;
        button.append(caption);
        return button;
    }

    function cancelButton() {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "action cancel";
        button.textContent = translate("Cancel");
        button.addEventListener("click", closeOverlay);
        return button;
    }

    // Zeile eines Griffs bzw. Schlosses: Name, Griffstellung und Verriegelung, rechts die passenden Befehle
    function handleRow(item, handle) {
        const row = document.createElement("div");
        row.className = "handle-row";
        row.dataset.available = String(handle.available === true);
        if (pendingById.has(handle.lockId)) {
            row.dataset.pending = "true";
        }
        if (failedIds.has(handle.lockId)) {
            row.dataset.failed = "true";
        }
        const info = document.createElement("div");
        info.className = "handle-info";
        const name = document.createElement("span");
        name.className = "handle-name";
        name.textContent = String(handle.label || "");
        const details = document.createElement("span");
        details.className = "handle-state";
        const texts = handle.available === true ? [handle.positionText, handle.lockText].filter((text) => typeof text === "string" && text !== "") : [translate("Not available")];
        details.textContent = texts.join(" · ");
        details.dataset.alert = String(handle.available === true && ((handle.hasPosition === true && handle.positionState !== "closed") || (handle.lockable === true && handle.lockStatus !== LOCK_LOCKED)));
        info.append(name, details);
        row.append(info);

        if (isLockable(handle)) {
            const commands = handle.commands || {};
            if (handle.lockStatus === LOCK_LOCKED) {
                const unlock = actionButton(commands.unlock, translate("Unlock"), "lock-open");
                unlock.addEventListener("click", () => runCommand(item, handle, commands.unlock, true));
                row.append(unlock);
            } else {
                const lock = actionButton(commands.lock, translate("Lock"), "lock");
                lock.disabled = !canLock(handle);
                if (lock.disabled) {
                    lock.title = translate("Close the handle to lock");
                }
                lock.addEventListener("click", () => runCommand(item, handle, commands.lock, true));
                row.append(lock);
            }
            // Schlösser mit Entriegeln und Öffnen: Öffnen (Falle ziehen) zusätzlich anbieten
            if (commands.open) {
                const open = actionButton(commands.open, translate("Open (command)"), "door-open");
                open.addEventListener("click", () => runCommand(item, handle, commands.open, true));
                row.append(open);
            }
        }
        return row;
    }

    function showOverlay() {
        overlay.hidden = false;
        document.body.dataset.dimmed = "true";
    }

    function closeOverlay() {
        overlay.hidden = true;
        overlayView = null;
        overlayHandles.replaceChildren();
        overlayActions.replaceChildren();
        delete document.body.dataset.dimmed;
    }

    function renderMenu(item) {
        const opening = item.opening;
        overlayTitle.textContent = String(opening.label || "");
        overlayText.textContent = opening.available === true ? String(opening.text || "") : translate("Not available");
        overlayText.hidden = false;
        overlayHandles.replaceChildren(...handlesOf(opening).map((handle) => handleRow(item, handle)));
        const buttons = [];
        const lockable = handlesOf(opening).filter(isLockable);
        if (lockable.length > 1) {
            const all = actionButton(null, translate("Lock all"), "lock");
            all.disabled = !lockable.some(canLock);
            all.addEventListener("click", () => lockAll(item));
            buttons.push(all);
        }
        overlayActions.replaceChildren(...buttons, cancelButton());
        overlay.setAttribute("aria-label", String(opening.label || ""));
    }

    function showMenu(item) {
        if (handlesOf(item.opening).length === 0) {
            return;
        }
        overlayView = { index: item.index, mode: "menu" };
        renderMenu(item);
        showOverlay();
        const first = overlay.querySelector("button:not(:disabled)");
        if (first) {
            first.focus({ preventScroll: true });
        }
    }

    function showConfirmation(item, handle, command, returnToMenu) {
        overlayView = { index: item.index, mode: "confirm" };
        overlayTitle.textContent = String(item.opening.label || "") + (handle.label ? " – " + String(handle.label) : "");
        overlayText.textContent = String(command.caption || "") + "?";
        overlayText.hidden = false;
        overlayHandles.replaceChildren();
        const button = actionButton(command, String(command.caption || ""), "lock-open");
        button.addEventListener("click", () => {
            sendCommand(handle, command);
            if (returnToMenu) {
                showMenu(item);
            } else {
                closeOverlay();
            }
        });
        overlayActions.replaceChildren(button, cancelButton());
        showOverlay();
        button.focus({ preventScroll: true });
    }

    // Offenes Menü mit den aktuellen Zuständen neu aufbauen; eine Rückfrage bleibt unverändert stehen.
    function refreshOverlay() {
        if (overlayView === null || overlayView.mode !== "menu") {
            return;
        }
        const item = items[overlayView.index];
        if (!item || item.opening.available !== true) {
            closeOverlay();
            return;
        }
        renderMenu(item);
    }

    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
            closeOverlay();
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) {
            closeOverlay();
        }
    });

    // --------- Darstellung ---------

    function applySummary(text) {
        const show = state.showSummary === true && typeof text === "string" && text !== "";
        summary.hidden = !show;
        summary.textContent = show ? text : "";
        summary.dataset.alert = String(items.some(({ opening }) => opening.available === true && ALERT_STATES.includes(opening.state)));
    }

    function applyOpeningState(item) {
        const { cell, button, graphic, statusLabel, opening } = item;
        const available = opening.available === true;
        cell.dataset.state = available && typeof opening.state === "string" ? opening.state : "unknown";
        button.disabled = !available;
        setIcon(graphic, opening.icon, DEFAULT_ICON[opening.kind] || DEFAULT_ICON.window);
        const text = available ? String(opening.text || "") : translate("Not available");
        if (statusLabel) {
            statusLabel.textContent = text;
        }
        const title = String(opening.label || "") + (text !== "" ? " – " + text : "");
        button.title = title;
        button.setAttribute("aria-label", title);
        refreshControls(item);
    }

    function renderFull() {
        const openings = Array.isArray(state.openings) ? state.openings : [];
        const showStatus = state.showStatus === true;
        closeOverlay();
        grid.replaceChildren();
        items = [];
        grid.dataset.count = String(openings.length);
        grid.dataset.lines = String((openings.some((opening) => opening.showLabel !== false) ? 1 : 0) + (showStatus ? 1 : 0));
        // Die Leiste richtet sich nach der Schaltfläche mit den meisten Griffen und Schlössern.
        const fullest = openings.reduce((best, opening) => (controlCount(opening) > controlCount(best) ? opening : best), {});
        grid.dataset.controls = String(controlCount(fullest));
        grid.dataset.hasControls = String(controlCount(fullest) > 0);
        grid.dataset.groups = String(Math.max(1, handlesOf(fullest).filter((handle) => handle.hasPosition === true || handle.lockable === true).length));
        layoutGrid();

        if (openings.length === 0) {
            applySummary("");
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = translate("No windows or doors configured");
            grid.append(empty);
            return;
        }

        openings.forEach((opening, index) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            const button = document.createElement("button");
            button.type = "button";
            button.className = "opening";
            const face = document.createElement("span");
            face.className = "face";
            const graphic = document.createElement("span");
            graphic.className = "graphic";
            face.append(graphic);
            button.append(face);
            if (opening.showLabel !== false) {
                const label = document.createElement("span");
                label.className = "label";
                label.textContent = String(opening.label || "");
                button.append(label);
            }
            let statusLabel = null;
            if (showStatus) {
                statusLabel = document.createElement("span");
                statusLabel.className = "label status-text";
                button.append(statusLabel);
            }
            cell.append(button);

            const item = { index, cell, button, graphic, statusLabel, opening, controls: [] };
            if (handlesOf(opening).length > 0) {
                cell.dataset.menu = "true";
                button.setAttribute("aria-haspopup", "dialog");
            }
            if (controlCount(opening) > 0) {
                cell.dataset.controls = "true";
                cell.append(buildControls(item));
            }
            button.addEventListener("click", () => {
                if (cell.dataset.menu === "true") {
                    pressFeedback(button);
                    showMenu(item);
                }
            });
            applyOpeningState(item);
            items.push(item);
            grid.append(cell);
        });
        applySummary(state.summary);
    }

    // Nur Zustände übernehmen, ohne das Raster neu aufzubauen (Menü bleibt offen).
    function applyStates(message) {
        message.openings.forEach((update, index) => {
            const item = items[index];
            if (!item || !update || typeof update !== "object") {
                return;
            }
            const opening = item.opening;
            ["available", "state", "text", "icon"].forEach((key) => (opening[key] = update[key]));
            const updates = Array.isArray(update.handles) ? update.handles : [];
            handlesOf(opening).forEach((handle, handleIndex) => {
                const next = updates[handleIndex];
                if (!next || next.id !== handle.id) {
                    return;
                }
                ["available", "hasPosition", "position", "positionState", "positionText", "lockable", "lockStatus", "lockText", "lockAllowed"].forEach((key) => (handle[key] = next[key]));
                const pending = pendingById.get(handle.lockId);
                if (pending && (handle.lockStatus !== pending.lockStatus || handle.available !== true)) {
                    window.clearTimeout(pending.timer);
                    pendingById.delete(handle.lockId);
                }
            });
            applyOpeningState(item);
        });
        state.summary = message.summary;
        applySummary(message.summary);
        refreshOverlay();
    }

    function handleMessage(data) {
        let message = data;
        if (typeof message === "string") {
            try {
                message = JSON.parse(message);
            } catch (error) {
                return;
            }
        }
        if (!message || typeof message !== "object" || Array.isArray(message)) {
            return;
        }
        if (message.type === "failed") {
            showFailed(message.id);
        } else if (message.type === "states" && Array.isArray(message.openings)) {
            applyStates(message);
        } else if (message.type === "full") {
            if (!Array.isArray(message.openings)) {
                message.openings = [];
            }
            state = message;
            renderFull();
        }
    }

    new ResizeObserver(layoutGrid).observe(grid);
    handleMessage(__QUICKWINDOW_INITIAL_STATE__);
</script>
